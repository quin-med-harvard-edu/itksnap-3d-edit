name: Build and package

on:
  push:
    branches:
      - 3d-editing-tool
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MACOS_DEPLOYMENT_TARGET: '14.0'

jobs:
  build:
    name: Build and package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel]
        itk_ver: ['v5.4.0']
        vtk_ver: ['9.5.2']
        qt_ver: ['6.8.1']
        include:
          - os: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
            ctest_cmd: xvfb-run -a ctest
          - os: macos-15
            qt_host: mac
            qt_arch: clang_64
            ctest_cmd: ctest
          - os: macos-15-intel
            qt_host: mac
            qt_arch: clang_64
            ctest_cmd: ctest

    steps:

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install system packages
        uses: ConorMacBride/install-package@v1
        with:
          brew: libssh
          apt: libcurl4-openssl-dev libssh-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          target: 'desktop'
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          cache: true
          extra: '--timeout 60'

      # ---------------------------------------------------------------- VTK
      - name: Restore VTK cache
        id: cache-vtk
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vtk/install
          key: ${{ matrix.os }}-vtk-${{ matrix.vtk_ver }}${{ runner.os == 'MacOS' && format('-osx{0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}

      - name: Checkout VTK
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: 'Kitware/VTK.git'
          ref: v${{ matrix.vtk_ver }}
          submodules: true
          path: 'vtk'

      - name: Build VTK
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        uses: threeal/cmake-action@v2.0.0
        with:
          source-dir: ${{ github.workspace }}/vtk
          build-dir: ${{ github.workspace }}/vtk/build
          build-args: "-t install -- -k 0"
          generator: Ninja
          options: |
            BUILD_TESTING:BOOL=FALSE
            BUILD_EXAMPLES:BOOL=FALSE
            BUILD_SHARED_LIBS:BOOL=FALSE
            VTK_REQUIRED_OBJCXX_FLAGS:STRING=
            VTK_GROUP_ENABLE_Qt:STRING=YES
            VTK_MODULE_ENABLE_VTK_GUISupportQtQuick:STRING=NO
            VTK_MODULE_ENABLE_VTK_GUISupportQtSQL:STRING=NO
            VTK_MODULE_ENABLE_VTK_RenderingExternal:STRING=WANT
            CMAKE_BUILD_TYPE=Release
            CMAKE_INSTALL_PREFIX=${{ github.workspace }}/vtk/install
            ${{ runner.os == 'MacOS' && format('CMAKE_OSX_DEPLOYMENT_TARGET={0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}

      - name: Cache VTK
        if: steps.cache-vtk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vtk/install
          key: ${{ matrix.os }}-vtk-${{ matrix.vtk_ver }}${{ runner.os == 'MacOS' && format('-osx{0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}

      # ---------------------------------------------------------------- ITK
      # ITK's install step misses one header (vnl_vector_ref.hxx), so ITK-SNAP
      # is pointed at the ITK *build* directory and that is what gets cached.
      - name: Restore ITK cache
        id: cache-itk
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/itk
          key: ${{ matrix.os }}-itk-${{ matrix.itk_ver }}-build${{ runner.os == 'MacOS' && format('-osx{0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}

      - name: Checkout ITK
        if: steps.cache-itk.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: 'InsightSoftwareConsortium/ITK.git'
          ref: ${{ matrix.itk_ver }}
          submodules: true
          path: 'itk'

      - name: Build ITK
        if: steps.cache-itk.outputs.cache-hit != 'true'
        uses: threeal/cmake-action@v2.0.0
        with:
          source-dir: ${{ github.workspace }}/itk
          build-dir: ${{ github.workspace }}/itk/build
          build-args: |
            -t
            install
          generator: Ninja
          options: |
            BUILD_TESTING:BOOL=FALSE
            BUILD_EXAMPLES:BOOL=FALSE
            Module_MorphologicalContourInterpolation:BOOL=TRUE
            CMAKE_BUILD_TYPE=Release
            CMAKE_INSTALL_PREFIX=${{ github.workspace }}/itk/install
            ${{ runner.os == 'MacOS' && format('CMAKE_OSX_DEPLOYMENT_TARGET={0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}

      - name: Cache ITK
        if: steps.cache-itk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/itk
          key: ${{ matrix.os }}-itk-${{ matrix.itk_ver }}-build${{ runner.os == 'MacOS' && format('-osx{0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}

      # ------------------------------------------------------------ ITK-SNAP
      - name: Checkout ITK-SNAP
        uses: actions/checkout@v4
        with:
          submodules: true
          path: itksnap
          persist-credentials: false

      # Works around a git error in the greedy submodule on some runners
      - name: Post-checkout fetch
        working-directory: ${{ github.workspace }}/itksnap
        shell: bash
        continue-on-error: true
        run: git fetch

      - name: Configure ITK-SNAP
        shell: bash
        run: |
          cmake -S itksnap -B itksnap/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DITK_DIR=${{ github.workspace }}/itk/build \
            -DVTK_DIR=${{ github.workspace }}/vtk/install/lib/cmake/vtk-9.5 \
            ${{ runner.os == 'MacOS' && format('-DCMAKE_OSX_DEPLOYMENT_TARGET={0}', env.MACOS_DEPLOYMENT_TARGET) || '' }}

      - name: Build ITK-SNAP
        shell: bash
        run: cmake --build itksnap/build --parallel

      - name: Test
        id: test
        working-directory: ${{ github.workspace }}/itksnap/build
        shell: bash
        continue-on-error: true
        run: ${{ matrix.ctest_cmd }} -LE Remote --output-on-failure 2>&1 | tee ctest.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.os }}
          path: ${{ github.workspace }}/itksnap/build/ctest.log
          if-no-files-found: ignore

      # ------------------------------------------------------------- Package
      - name: Package ITK-SNAP
        working-directory: ${{ github.workspace }}/itksnap/build
        shell: bash
        run: cpack --verbose

      - name: Read package name
        id: package
        working-directory: ${{ github.workspace }}/itksnap/build
        shell: bash
        run: echo "package_file=$(jq -r '.filename' package_info.json)" >> $GITHUB_OUTPUT

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_file }}
          path: ${{ github.workspace }}/itksnap/build/${{ steps.package.outputs.package_file }}

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/itksnap/build/${{ steps.package.outputs.package_file }}
          fail_on_unmatched_files: true
